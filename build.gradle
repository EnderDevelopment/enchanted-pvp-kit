plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT'
    id 'maven-publish'
}

def fabricProperties = new Properties()
file('gradle.properties').withInputStream { fabricProperties.load(it) }

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = fabricProperties['minecraft_version']
        mappingsVersion = 'official'
        runConfigs.create('client') {
            property 'fabric.development', 'true'
            mainClass = 'net.fabricmc.loader.launch.knot.KnotClient'
        }
        runConfigs.create('server') {
            property 'fabric.development', 'true'
            mainClass = 'net.fabricmc.loader.launch.knot.KnotServer'
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:${fabricProperties['minecraft_version']}'
    mappings 'net.fabricmc:yarn:${fabricProperties['minecraft_version']}:v2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:${fabricProperties['fabric_api_version']}'
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand 'version':project.version
    }
    into 'build/resources/main'
}
